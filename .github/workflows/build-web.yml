name: Build web

# Pull requests always run this workflow, so the required build-web-gate check always reports;
# the changes job skips the build jobs when the PR does not touch web/ or this file.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/build-web.yml

concurrency:
  group: build-web-${{ github.ref }}
  # A newer push to a PR cancels its older run; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}

    steps:
      # fetch-depth 0 makes the base..head commits available to the diff.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # A push to main passed the paths filter above, so it always builds.
      - name: Detect web changes
        id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            changed=true
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(web/|\.github/workflows/build-web\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "web=$changed" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in shipped dependencies (moderate ones do not fail the build).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker-build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # The required status check on main. It always runs and fails when a needed job failed or was
  # cancelled; build jobs skipped because web/ is unchanged count as passed.
  build-web-gate:
    needs: [changes, build, docker-build-web]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the build jobs
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
