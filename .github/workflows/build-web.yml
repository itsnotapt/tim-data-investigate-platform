name: Build web

# Pull requests always run this workflow, so the required build-web-gate check always reports;
# the changes job skips the build jobs when the PR does not touch web/, this file, or a file the
# web checks read from outside web/ (.editorconfig, which Prettier reads). The e2e job also runs
# when api/ changes, because its flows run against a real tim-api.
# The e2e job runs the @smoke flows on a PR, and every flow on a push to main and on a release PR.
# On main, the main-e2e-issue job keeps an issue open while the full suite fails.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - web/**
      - api/**
      - .editorconfig
      - .github/workflows/build-web.yml

concurrency:
  group: build-web-${{ github.ref }}
  # A newer push to a PR cancels its older run; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.diff.outputs.web }}
      e2e: ${{ steps.diff.outputs.e2e }}

    steps:
      # fetch-depth 0 makes the base..head commits available to the diff.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # A push to main passed the paths filter above, so it always builds.
      - name: Detect web changes
        id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            web=true
            e2e=true
          else
            # Diff on its own line, so a failed diff fails this job and the gate instead of reading
            # as "no changes".
            files=$(git diff --name-only "$BASE...$HEAD")
            web=false
            e2e=false
            if grep -qE '^(web/|\.editorconfig$|\.github/workflows/build-web\.yml$)' <<<"$files"; then
              web=true
              e2e=true
            elif grep -qE '^api/' <<<"$files"; then
              e2e=true
            fi
          fi
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
          echo "e2e=$e2e" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on high/critical advisories in shipped dependencies (moderate ones do not fail the build).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The mocked flows and the flows against a real tim-api (playwright.config.ts starts it on this
  # Postgres service, reset once per run).
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install api dependencies
        working-directory: api
        run: uv sync --locked --all-packages

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run "$SCRIPT"
        env:
          SCRIPT: ${{ (github.event_name == 'push' || startsWith(github.head_ref, 'release-please--')) && 'e2e' || 'e2e:smoke' }}
          TIM_TEST_DATABASE_URL: postgresql+asyncpg://tim:tim@localhost:5432/tim_e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # A push to main ran the full suite: open, comment on or close the tracking issue.
  main-e2e-issue:
    needs: e2e
    if: always() && github.event_name == 'push' && (needs.e2e.result == 'success' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Update the tracking issue
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.e2e.result }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/main_e2e_issue.py "$RESULT" --sha "$GITHUB_SHA" --message "$MESSAGE"
          --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL"

  docker-build-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # The required status check on main. It always runs and fails when a needed job failed or was
  # cancelled; jobs skipped because their files are unchanged count as passed.
  build-web-gate:
    needs: [changes, build, e2e, docker-build-web]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the build jobs
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
