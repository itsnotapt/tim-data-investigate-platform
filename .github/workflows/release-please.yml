on:
  push:
    branches:
      - main

name: release-please

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # web, api and the chart are a linked-versions group: they release together with one version.
      web-release: ${{ steps.release.outputs.web--release_created }}
      web-version: ${{ steps.release.outputs.web--version }}
      api-release: ${{ steps.release.outputs.api--release_created }}
      api-version: ${{ steps.release.outputs.api--version }}
      chart-release: ${{ steps.release.outputs['deploy/helm/tim--release_created'] }}
      chart-version: ${{ steps.release.outputs['deploy/helm/tim--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.web-release }}
    steps:
      - uses: actions/checkout@v4

      - name: Log into github docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tim-web
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.web-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.web-version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.web-version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-api:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.api-release }}
    steps:
      - uses: actions/checkout@v4

      - name: Log into github docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tim-api
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.api-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.api-version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.api-version }}
            type=sha

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-chart:
    runs-on: ubuntu-latest
    # The chart's appVersion is the default image tag, so publish it only after both images.
    needs: [release-please, build-web, build-api]
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.chart-release }}
    env:
      CHART_VERSION: ${{ needs.release-please.outputs.chart-version }}
      WEB_VERSION: ${{ needs.release-please.outputs.web-version }}
      API_VERSION: ${{ needs.release-please.outputs.api-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the chart matches the image versions
        run: |
          app_version="$(sed -n 's/^appVersion: *"\([^"]*\)".*/\1/p' deploy/helm/tim/Chart.yaml)"
          if [ "$app_version" != "$CHART_VERSION" ] || [ "$WEB_VERSION" != "$CHART_VERSION" ] || [ "$API_VERSION" != "$CHART_VERSION" ]; then
            echo "chart $CHART_VERSION, appVersion $app_version, web $WEB_VERSION, api $API_VERSION must be equal" >&2
            exit 1
          fi

      - uses: azure/setup-helm@v4

      - name: Log into github registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Package chart
        run: helm package deploy/helm/tim --destination "$RUNNER_TEMP/chart"

      - name: Push chart
        run: |
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          helm push "$RUNNER_TEMP/chart/tim-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${repo}/charts"
