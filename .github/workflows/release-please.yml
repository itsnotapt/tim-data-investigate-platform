on:
  push:
    branches:
      - main

name: release-please

# Least privilege by default; each job below grants what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # frontend (web), backend (api) and the chart (deploy/helm/tim) release independently. See
      # docs/adr/0016-release-versions.md.
      web-release: ${{ steps.release.outputs.web--release_created }}
      web-version: ${{ steps.release.outputs.web--version }}
      api-release: ${{ steps.release.outputs.api--release_created }}
      api-version: ${{ steps.release.outputs.api--version }}
      chart-release: ${{ steps.release.outputs['deploy/helm/tim--release_created'] }}
      chart-version: ${{ steps.release.outputs['deploy/helm/tim--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main

  build-web:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.web-release }}
    steps:
      - uses: actions/checkout@v7

      - name: Log into github docker
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.web-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.web-version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.web-version }}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-api:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.api-release }}
    steps:
      - uses: actions/checkout@v7

      - name: Log into github docker
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.api-version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.api-version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.api-version }}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-chart:
    runs-on: ubuntu-latest
    # The chart pins image tags from image-tags.yaml. When a component releases in the same run,
    # wait for its image; a skipped image build (no release this run) does not block the chart.
    needs: [release-please, build-web, build-api]
    permissions:
      contents: read
      packages: write
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.chart-release }}
    env:
      CHART_VERSION: ${{ needs.release-please.outputs.chart-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the chart version and pinned images
        run: |
          chart_version="$(sed -n 's/^version: *\([^ ]*\).*/\1/p' deploy/helm/tim/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: *"\([^"]*\)".*/\1/p' deploy/helm/tim/Chart.yaml)"
          if [ "$chart_version" != "$CHART_VERSION" ] || [ "$app_version" != "$CHART_VERSION" ]; then
            echo "Chart.yaml version $chart_version and appVersion $app_version must equal the release $CHART_VERSION" >&2
            exit 1
          fi
          frontend="$(yq '.frontend' deploy/helm/tim/image-tags.yaml)"
          backend="$(yq '.backend' deploy/helm/tim/image-tags.yaml)"
          web_version="$(jq -r .version web/package.json)"
          api_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' api/pyproject.toml)"
          if [ "$frontend" != "$web_version" ] || [ "$backend" != "$api_version" ]; then
            echo "image-tags.yaml (frontend $frontend, backend $backend) must match web $web_version and api $api_version" >&2
            exit 1
          fi

      - name: Log into github docker
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the pinned images exist
        run: |
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          for component in frontend backend; do
            tag="$(yq ".${component}" deploy/helm/tim/image-tags.yaml)"
            docker buildx imagetools inspect "${REGISTRY}/${repo}/${component}:${tag}" >/dev/null
          done

      - uses: azure/setup-helm@v5

      - name: Log into github registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Package chart
        run: helm package deploy/helm/tim --destination "$RUNNER_TEMP/chart"

      - name: Push chart
        run: |
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          helm push "$RUNNER_TEMP/chart/tim-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${repo}/charts"
