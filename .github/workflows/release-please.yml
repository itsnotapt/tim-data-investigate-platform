on:
  push:
    branches:
      - main

name: release-please

# Least privilege by default; each job below grants what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      # The root package is TIM: both images and the chart share its version. tim-actions releases
      # on its own and publishes nothing here. See docs/adr/0024-one-release-version.md.
      release: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main

  build-images:
    runs-on: ubuntu-latest
    needs: release-please
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.release }}
    strategy:
      matrix:
        image: [api, web]
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Log into github docker
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=semver,pattern={{major}},value=${{ env.VERSION }}
            type=sha

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

  publish-chart:
    runs-on: ubuntu-latest
    needs: [release-please, build-images]
    permissions:
      contents: read
      packages: write
    if: ${{ needs.release-please.outputs.release }}
    env:
      CHART_VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the chart version
        run: |
          chart_version="$(sed -n 's/^version: *\([^ ]*\).*/\1/p' deploy/helm/tim/Chart.yaml)"
          app_version="$(sed -n 's/^appVersion: *"\([^"]*\)".*/\1/p' deploy/helm/tim/Chart.yaml)"
          if [ "$chart_version" != "$CHART_VERSION" ] || [ "$app_version" != "$CHART_VERSION" ]; then
            echo "Chart.yaml version $chart_version and appVersion $app_version must equal the release $CHART_VERSION" >&2
            exit 1
          fi

      - name: Log into github docker
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the chart's images exist
        run: |
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          for image in api web; do
            docker buildx imagetools inspect "${REGISTRY}/${repo}/${image}:${CHART_VERSION}" >/dev/null
          done

      - uses: azure/setup-helm@v5

      - name: Log into github registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Package chart
        run: helm package deploy/helm/tim --destination "$RUNNER_TEMP/chart"

      - name: Push chart
        run: |
          repo="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          helm push "$RUNNER_TEMP/chart/tim-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${repo}/charts"
