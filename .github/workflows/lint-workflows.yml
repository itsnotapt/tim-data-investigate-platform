name: Lint workflows

on:
  pull_request:
    paths:
      - .github/**
  push:
    branches:
      - main
    paths:
      - .github/**

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  # sha256 of actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz (from the release's checksums file).
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # Lints every workflow; run: scripts are checked with the shellcheck preinstalled on ubuntu-latest.
      - name: Lint workflows
        run: actionlint -color -verbose

  scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test workflow scripts
        run: python3 -m unittest discover -s .github/scripts -v
