# Enforces the PR rules in docs/RULES.md (sections 6 and 7); rationale in docs/decisions/0016-release-versions.md.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            style
            revert
          requireScope: false

  branch:
    name: Branch name
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 .github/scripts/pr_conventions.py branch "$BRANCH"

  commits:
    name: Commit subjects
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/pr_conventions.py commits "$BASE" "$HEAD"

  breaking:
    name: Breaking changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check breaking changes and Release-As footers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/pr_conventions.py breaking "$BASE" "$HEAD" --labels "$LABELS"
