# Enforces the PR title rule in docs/RULES.md section 6.
# The pr-conventions job is a required status check on main.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-conventions:
    name: pr-conventions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # release-please writes the release PRs and their titles.
      - name: Check the PR title
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/pr_conventions.py "$TITLE"
