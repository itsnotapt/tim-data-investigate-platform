# Enforces the PR rules in docs/RULES.md sections 6 and 7; rationale in docs/adr/0016-release-versions.md.
# The pr-conventions job is the required status check on main.
name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-conventions:
    name: pr-conventions
    # release-please writes the release PRs and their titles.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 makes the base..head commits available to the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check PR conventions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/pr_conventions.py pr "$BASE" "$HEAD" --title "$TITLE"
