name: Build api

# Pull requests always run this workflow, so the required build-api-gate check always reports;
# the changes job skips the build jobs when the PR does not touch api/, this file, or a file the
# api tests read from outside api/ (docs/architecture.md, web/src/lib/api/openapi.json,
# deploy/config/).
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - api/**
      - docs/architecture.md
      - web/src/lib/api/openapi.json
      - deploy/config/**
      - .github/workflows/build-api.yml

concurrency:
  group: build-api-${{ github.ref }}
  # A newer push to a PR cancels its older run; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}

    steps:
      # fetch-depth 0 makes the base..head commits available to the diff.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # A push to main passed the paths filter above, so it always builds.
      - name: Detect api changes
        id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            changed=true
          else
            # Diff on its own line, so a failed diff fails this job and the gate instead of reading
            # as "no changes".
            files=$(git diff --name-only "$BASE...$HEAD")
            if grep -qE '^(api/|docs/architecture\.md$|web/src/lib/api/openapi\.json$|deploy/config/|\.github/workflows/build-api\.yml$)' <<<"$files"; then
              changed=true
            else
              changed=false
            fi
          fi
          echo "api=$changed" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      # Both workspace members: tim-api and tim-actions (api/tim-actions).
      - name: Install dependencies
        run: uv sync --locked --all-packages

      # ruff covers both members, each with its own settings.
      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
        env:
          TIM_TEST_DATABASE_URL: postgresql+asyncpg://tim:tim@localhost:5432/tim_test

      - name: Type check tim-actions
        working-directory: api/tim-actions
        run: uv run mypy

      - name: Test tim-actions
        working-directory: api/tim-actions
        run: uv run pytest

  # The live Kusto tests (`pytest -m kusto`), on pushes to main only: the test app's federated
  # credential trusts refs/heads/main, so a PR could not sign in. Skipped until the repository
  # variables are set, and not part of build-api-gate.
  kusto-live:
    needs: changes
    if: >-
      github.event_name == 'push' && needs.changes.outputs.api == 'true'
      && vars.TIM_TESTS_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # DefaultAzureCredential in the tests picks up this Azure CLI login.
      - name: Sign in as the test app
        uses: azure/login@v3
        with:
          client-id: ${{ vars.TIM_TESTS_CLIENT_ID }}
          tenant-id: ${{ vars.TIM_TESTS_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Live Kusto tests
        run: uv run pytest -m kusto --no-cov
        env:
          TIM_TEST_KUSTO_CLUSTER: ${{ vars.TIM_TEST_KUSTO_CLUSTER }}
          TIM_TEST_KUSTO_QUERY_DATABASE: ${{ vars.TIM_TEST_KUSTO_QUERY_DATABASE || 'Research' }}
          TIM_TEST_KUSTO_INGEST_URL: ${{ vars.TIM_TEST_KUSTO_INGEST_URL }}
          TIM_TEST_KUSTO_DATABASE: ${{ vars.TIM_TEST_KUSTO_DATABASE || 'Research' }}

  docker-build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Loaded into the runner's Docker, not pushed, for the steps below.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          load: true
          tags: tim-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Check deploy/config
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/config:/etc/tim:ro" tim-api:ci
          tim-api check --actions /etc/tim/actions --connections /etc/tim/connections.yaml
          --labels /etc/tim/labels.yaml

      # A derived image as docs/deployment.md describes, from the image above. The default
      # builder (docker driver) sees images loaded into the runner's Docker; the buildx builder
      # above does not.
      - name: Build a derived image with a provider
        run: >-
          docker buildx build --builder default --load --build-arg BASE=tim-api:ci
          --tag tim-derived:ci tests/derived-image

      # The connections file uses the provider's connection type, so the check fails without it.
      - name: Check the derived image
        run: |
          docker run --rm -v "$PWD/tests/derived-image/config:/etc/tim:ro" tim-derived:ci \
            tim-api check --connections /etc/tim/connections.yaml
          docker run --rm tim-derived:ci tim-api schema connections | grep -q '"ci_static"'

      - name: A provider for another tim-actions major fails the build
        run: |
          if docker buildx build --builder default --build-arg BASE=tim-api:ci \
              --build-arg PROVIDER=incompatible tests/derived-image > build.log 2>&1; then
            echo "the incompatible provider installed" >&2
            exit 1
          fi
          # Only the constraints' tim-actions pin counts: without it the build fails too, because
          # no tim-actions 2 is published.
          grep -qE 'depends on tim-actions>=2,<3 and tim-actions==[0-9]' build.log \
            || { cat build.log; exit 1; }

  # The required status check on main. It always runs and fails when a needed job failed or was
  # cancelled; build jobs skipped because api/ is unchanged count as passed.
  build-api-gate:
    needs: [changes, test, docker-build-api]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the build jobs
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
