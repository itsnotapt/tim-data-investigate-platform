name: Build api

on:
  pull_request:
    paths:
      - api/**
      - .github/workflows/build-api.yml
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/build-api.yml

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
        env:
          TIM_TEST_DATABASE_URL: postgresql+asyncpg://tim:tim@localhost:5432/tim_test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
