name: Build api

# Pull requests always run this workflow, so the required build-api-gate check always reports;
# the changes job skips the build jobs when the PR does not touch api/ or this file.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - api/**
      - .github/workflows/build-api.yml

concurrency:
  group: build-api-${{ github.ref }}
  # A newer push to a PR cancels its older run; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}

    steps:
      # fetch-depth 0 makes the base..head commits available to the diff.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      # A push to main passed the paths filter above, so it always builds.
      - name: Detect api changes
        id: diff
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            changed=true
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(api/|\.github/workflows/build-api\.yml$)'; then
            changed=true
          else
            changed=false
          fi
          echo "api=$changed" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: tim
          POSTGRES_PASSWORD: tim
          POSTGRES_DB: tim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tim -d tim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
        env:
          TIM_TEST_DATABASE_URL: postgresql+asyncpg://tim:tim@localhost:5432/tim_test

  docker-build-api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # The required status check on main. It always runs and fails when a needed job failed or was
  # cancelled; build jobs skipped because api/ is unchanged count as passed.
  build-api-gate:
    needs: [changes, test, docker-build-api]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the build jobs
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
