name: Deploy check

on:
  pull_request:
    paths:
      - deploy/**
      - examples/instance/config/**
      - examples/instance/deploy/**
      - .release-please-manifest.json
      - release-please-config.json
      - compose.yaml
      - .env.example
      - web/package.json
      - web/package-lock.json
      - api/pyproject.toml
      - api/uv.lock
      - .github/workflows/deploy-check.yml
  push:
    branches:
      - main
    paths:
      - deploy/**
      - examples/instance/config/**
      - examples/instance/deploy/**
      - .release-please-manifest.json
      - release-please-config.json
      - compose.yaml
      - .env.example
      - web/package.json
      - web/package-lock.json
      - api/pyproject.toml
      - api/uv.lock
      - .github/workflows/deploy-check.yml

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHART: deploy/helm/tim
  KUBECONFORM_VERSION: v0.8.0

jobs:
  helm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.34.0", "1.35.0", "1.36.0", "1.37.0"]

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.22.0

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Lint
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm lint ($values)"
            helm lint "$CHART" --strict -f "$values" --kube-version "${{ matrix.kubernetes }}"
            echo "::endgroup::"
          done

      - name: Template and validate against the Kubernetes schema
        run: |
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::helm template | kubeconform ($values)"
            helm template tim "$CHART" -f "$values" --kube-version "${{ matrix.kubernetes }}" \
              | kubeconform -strict -summary -kubernetes-version "${{ matrix.kubernetes }}" -
            echo "::endgroup::"
          done

      - name: Required values are enforced
        run: |
          if helm template tim "$CHART" >/dev/null 2>&1; then
            echo "rendering without required values must fail" >&2
            exit 1
          fi

      - name: Release versions are consistent
        shell: python
        run: |
          import json, re, sys, tomllib
          chart = open("deploy/helm/tim/Chart.yaml").read()
          lock = tomllib.load(open("api/uv.lock", "rb"))
          package_lock = json.load(open("web/package-lock.json"))
          versions = {
              "web/package.json": json.load(open("web/package.json"))["version"],
              "web/package-lock.json": package_lock["version"],
              "web/package-lock.json packages['']": package_lock["packages"][""]["version"],
              "api/pyproject.toml": tomllib.load(open("api/pyproject.toml", "rb"))["project"]["version"],
              "api/uv.lock tim-api": next(p["version"] for p in lock["package"] if p["name"] == "tim-api"),
              "Chart.yaml version": re.search(r"^version: *(\S+)", chart, re.M).group(1),
              "Chart.yaml appVersion": re.search(r'^appVersion: *"([^"]+)"', chart, re.M).group(1),
          }
          # The manifest has TIM's version from its first release on.
          manifest = json.load(open(".release-please-manifest.json"))
          if "." in manifest:
              versions["manifest ."] = manifest["."]
          if len(set(versions.values())) != 1:
              sys.exit(f"TIM's versions differ: {versions}")

      - name: Image tags default to the appVersion
        run: |
          rendered="$(helm template tim "$CHART" -f "$CHART/ci/minimal-values.yaml")"
          version="$(yq '.appVersion' "$CHART/Chart.yaml")"
          for image in api web; do
            if ! grep -q "image: \"ghcr.io/itsnotapt/tim-data-investigate-platform/${image}:${version}\"" <<<"$rendered"; then
              echo "the $image image must default to ghcr.io/itsnotapt/tim-data-investigate-platform/${image}:${version} (the appVersion)" >&2
              exit 1
            fi
          done

      - name: Migrations wait-for-postgresql sets PGUSER
        run: |
          pguser="$(helm template tim "$CHART" -f "$CHART/ci/full-values.yaml" \
            | yq 'select(.kind == "Job") | .spec.template.spec.initContainers[] | select(.name == "wait-for-postgresql") | .env[] | select(.name == "PGUSER") | .value')"
          if [ -z "$pguser" ]; then
            echo "the migrations wait-for-postgresql init container must set a non-empty PGUSER" >&2
            exit 1
          fi

      - name: Test pod is kept after it runs
        run: |
          policy="$(helm template tim "$CHART" -f "$CHART/ci/minimal-values.yaml" \
            | yq 'select(.kind == "Pod" and .metadata.annotations."helm.sh/hook" == "test") | .metadata.annotations."helm.sh/hook-delete-policy"')"
          if [ "$policy" != "before-hook-creation" ]; then
            echo "the test pod's helm.sh/hook-delete-policy must be before-hook-creation, got '$policy'" >&2
            exit 1
          fi

      - name: Config checksums are per component
        run: |
          checksum() { # <component> <helm template args...>
            local component="$1"
            shift
            helm template tim "$CHART" -f "$CHART/ci/minimal-values.yaml" "$@" \
              | yq "select(.kind == \"Deployment\" and .metadata.name == \"*-${component}\") | .spec.template.metadata.annotations.\"checksum/config\""
          }
          api="$(checksum api)"
          web="$(checksum web)"
          api_log="$(checksum api --set api.logLevel=DEBUG)"
          web_log="$(checksum web --set api.logLevel=DEBUG)"
          api_wiki="$(checksum api --set web.helpWikiUri=https://wiki.example.org)"
          web_wiki="$(checksum web --set web.helpWikiUri=https://wiki.example.org)"
          for value in "$api" "$web" "$api_log" "$web_log" "$api_wiki" "$web_wiki"; do
            if [ -z "$value" ] || [ "$value" = null ]; then
              echo "the api and web Deployments must both have a checksum/config annotation" >&2
              exit 1
            fi
          done
          if [ "$api" = "$web" ] || [ "$api" = "$api_log" ] || [ "$web" != "$web_log" ] \
            || [ "$web" = "$web_wiki" ] || [ "$api" != "$api_wiki" ]; then
            echo "each Deployment's checksum/config must cover only its own ConfigMap" >&2
            exit 1
          fi

      - name: Instance files are mounted under /etc/tim
        run: |
          # shellcheck disable=SC2016 # jq definitions, not shell
          defs='
            def api_pod: .[] | select(.kind == "Deployment" and .metadata.name == "acme-tim-api") | .spec.template;
            def api: api_pod.spec.containers[] | select(.name == "api");
            def configmap($name): [.[] | select(.kind == "ConfigMap" and .metadata.name == $name)];
            def volume($name): [api_pod.spec.volumes[] | select(.name == $name)];
            def mounts($name): [api.volumeMounts[] | select(.name == $name)];
            def env($name): [api.env[] | select(.name == $name) | .value];'
          check() { # <failure message> <jq expression over the rendered documents> <helm template args...>
            local message="$1" expression="$2"
            shift 2
            if ! helm template acme "$CHART" -f "$CHART/ci/minimal-values.yaml" "$@" | yq -o json -I0 . \
              | jq -s -e "$defs $expression" > /dev/null; then
              echo "$message" >&2
              exit 1
            fi
          }
          # Prints the api pod's annotation, empty when absent.
          annotation() { # <name> <helm template args...>
            local name="$1"
            shift
            helm template acme "$CHART" -f "$CHART/ci/minimal-values.yaml" "$@" \
              | yq "select(.kind == \"Deployment\" and .metadata.name == \"acme-tim-api\") | .spec.template.metadata.annotations.\"$name\" // \"\""
          }

          triage=(--set-string 'actions.files.triage\.yaml=kql_file: triage.kql' --set-string 'actions.files.triage\.kql=StormEvents')
          check "actions.files must render <release>-tim-actions with one key per file, sidecars included" \
            'configmap("acme-tim-actions") | map(.data) == [{"triage.yaml": "kql_file: triage.kql", "triage.kql": "StormEvents"}]' "${triage[@]}"
          check "actions.files must be mounted read-only at /etc/tim/actions with TIM_ACTIONS_DIR set" \
            'volume("actions") == [{"name": "actions", "configMap": {"name": "acme-tim-actions"}}]
              and mounts("actions") == [{"name": "actions", "mountPath": "/etc/tim/actions", "readOnly": true}]
              and env("TIM_ACTIONS_DIR") == ["/etc/tim/actions"]' "${triage[@]}"
          actions="$(annotation checksum/actions "${triage[@]}")"
          changed="$(annotation checksum/actions "${triage[@]}" --set-string 'actions.files.triage\.kql=StormEvents | count')"
          if [ -z "$actions" ] || [ "$actions" = "$changed" ]; then
            echo "the api pod's checksum/actions must change when an action file changes" >&2
            exit 1
          fi

          existing=(--set actions.existingConfigMap=acme-actions)
          check "actions.existingConfigMap must be mounted at /etc/tim/actions without a chart ConfigMap" \
            'volume("actions") == [{"name": "actions", "configMap": {"name": "acme-actions"}}]
              and mounts("actions") == [{"name": "actions", "mountPath": "/etc/tim/actions", "readOnly": true}]
              and env("TIM_ACTIONS_DIR") == ["/etc/tim/actions"]
              and configmap("acme-tim-actions") == []' "${existing[@]}"
          if [ -n "$(annotation checksum/actions "${existing[@]}")" ]; then
            echo "actions.existingConfigMap must not add a checksum/actions annotation" >&2
            exit 1
          fi

          if helm template acme "$CHART" -f "$CHART/ci/minimal-values.yaml" "${triage[@]}" "${existing[@]}" > /dev/null 2>&1; then
            echo "actions.files and actions.existingConfigMap together must fail" >&2
            exit 1
          fi
          check "without actions there must be no actions volume, mount, variable or ConfigMap" \
            'volume("actions") == [] and mounts("actions") == [] and env("TIM_ACTIONS_DIR") == []
              and configmap("acme-tim-actions") == []'

          connections=(--set-json 'connections=[{"name": "samples", "type": "kusto", "auth": "obo"}]')
          labels=(--set-json 'labels=[{"key": "malicious", "name": "Malicious"}]')
          check "connections and labels must render into <release>-tim-api-files" \
            'configmap("acme-tim-api-files") | map(.data) == [{
                "connections.yaml": "- auth: obo\n  name: samples\n  type: kusto\n",
                "labels.yaml": "- key: malicious\n  name: Malicious\n"}]' "${connections[@]}" "${labels[@]}"
          check "connections and labels must be mounted read-only under /etc/tim with their variables set" \
            'volume("api-files") == [{"name": "api-files", "configMap": {"name": "acme-tim-api-files"}}]
              and mounts("api-files") == [
                {"name": "api-files", "mountPath": "/etc/tim/connections.yaml", "subPath": "connections.yaml", "readOnly": true},
                {"name": "api-files", "mountPath": "/etc/tim/labels.yaml", "subPath": "labels.yaml", "readOnly": true}]
              and env("TIM_CONNECTIONS_FILE") == ["/etc/tim/connections.yaml"]
              and env("TIM_LABELS_FILE") == ["/etc/tim/labels.yaml"]' "${connections[@]}" "${labels[@]}"
          check "labels alone must render and mount only labels.yaml" \
            '(configmap("acme-tim-api-files") | map(.data | keys)) == [["labels.yaml"]]
              and (mounts("api-files") | map(.mountPath)) == ["/etc/tim/labels.yaml"]
              and env("TIM_CONNECTIONS_FILE") == [] and env("TIM_LABELS_FILE") == ["/etc/tim/labels.yaml"]' "${labels[@]}"
          check "without connections and labels there must be no api-files volume, mount, variable or ConfigMap" \
            'volume("api-files") == [] and mounts("api-files") == [] and configmap("acme-tim-api-files") == []
              and env("TIM_CONNECTIONS_FILE") == [] and env("TIM_LABELS_FILE") == []'
          files="$(annotation checksum/api-files "${labels[@]}")"
          changed="$(annotation checksum/api-files --set-json 'labels=[{"key": "benign", "name": "Benign"}]')"
          if [ -z "$files" ] || [ "$files" = "$changed" ]; then
            echo "the api pod's checksum/api-files must change when the labels change" >&2
            exit 1
          fi

      - name: Derived images need a tag or digest
        run: |
          derived=(--set api.image.repository=registry.example.com/acme/tim-api)
          if helm template tim "$CHART" -f "$CHART/ci/minimal-values.yaml" "${derived[@]}" > /dev/null 2>&1; then
            echo "an api.image.repository other than the default without api.image.tag or digest must fail" >&2
            exit 1
          fi
          images="$(helm template tim "$CHART" -f "$CHART/ci/full-values.yaml" "${derived[@]}" --set api.image.tag=2.0.0-acme.3 \
            | yq -N 'select(.kind == "Deployment" or .kind == "Job") | .spec.template.spec.containers[] | select(.name == "api" or .name == "migrate") | .image' \
            | sort | tr '\n' ' ')"
          if [ "$images" != "registry.example.com/acme/tim-api:2.0.0-acme.3 registry.example.com/acme/tim-api:2.0.0-acme.3 " ]; then
            echo "the api Deployment and the migrations Job must both run the derived image, got: $images" >&2
            exit 1
          fi

      - name: The OBO credential is required only for obo connections
        run: |
          # Succeeds when production values without an OBO credential render.
          renders() { # <helm template args...>
            helm template tim "$CHART" -f "$CHART/ci/minimal-values.yaml" --set secrets.authClientSecret= "$@" > /dev/null 2>&1
          }
          if ! renders; then
            echo "without connections the chart must not require an OBO credential" >&2
            exit 1
          fi
          if ! renders --set-json 'connections=[{"name": "warehouse", "type": "snowflake", "auth": "workload_identity"}]'; then
            echo "without an obo connection the chart must not require an OBO credential" >&2
            exit 1
          fi
          if renders --set-json 'connections=[{"name": "warehouse", "type": "snowflake", "auth": "workload_identity"}, {"name": "samples", "type": "kusto", "auth": "obo"}]'; then
            echo "an obo connection without an OBO credential must fail" >&2
            exit 1
          fi

      # examples/instance/deploy/helm/values.yaml renders on top of the operator's values, with
      # the files of the example's config/.
      - name: The example instance renders its files
        run: |
          example=examples/instance
          rendered="$(helm template acme "$CHART" -f "$CHART/ci/minimal-values.yaml" \
            -f "$example/deploy/helm/values.yaml" --kube-version "${{ matrix.kubernetes }}")"
          kubeconform -strict -summary -kubernetes-version "${{ matrix.kubernetes }}" - <<<"$rendered"
          data() { # <ConfigMap name>
            yq -o json "select(.kind == \"ConfigMap\" and .metadata.name == \"$1\") | .data" <<<"$rendered"
          }
          # The action files byte for byte, sidecars included.
          actions="$(for f in "$example"/config/actions/*; do
            jq -n --arg name "${f##*/}" --rawfile text "$f" '{($name): $text}'
          done | jq -s add)"
          if ! jq -n -e --argjson want "$actions" --argjson got "$(data acme-tim-actions)" '$want == $got' > /dev/null; then
            echo "actions.files in $example/deploy/helm/values.yaml must match $example/config/actions" >&2
            exit 1
          fi
          # The connections and labels as YAML values.
          for file in connections labels; do
            got="$(data acme-tim-api-files | jq -r --arg key "$file.yaml" '.[$key]' | yq -p yaml -o json)"
            if ! jq -n -e --argjson want "$(yq -o json "$example/config/$file.yaml")" --argjson got "$got" \
              '$want == $got' > /dev/null; then
              echo "$file in $example/deploy/helm/values.yaml must match $example/config/$file.yaml" >&2
              exit 1
            fi
          done

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate dev stack
        run: docker compose -f compose.yaml config --quiet

      - name: Validate production stack
        run: |
          # Required values left empty in the template.
          sed -e 's|^TIM_AUTH_TENANT_ID=$|TIM_AUTH_TENANT_ID=00000000-0000-0000-0000-000000000000|' \
              -e 's|^TIM_AUTH_CLIENT_ID=$|TIM_AUTH_CLIENT_ID=00000000-0000-0000-0000-000000000000|' \
              -e 's|^TIM_AUTH_CLIENT_SECRET=$|TIM_AUTH_CLIENT_SECRET=ci|' \
              deploy/.env.example > deploy/.env
          docker compose -f deploy/compose.prod.yaml --env-file deploy/.env config --quiet

      # The api mounts TIM_CONFIG_DIR read-only at /etc/tim and gets the three file variables,
      # empty by default.
      - name: Check the instance files
        run: |
          # assert_api_mount <compose args> -- <config dir> <actions dir> <connections file> <labels file>
          assert_api_mount() {
            local args=()
            while [ "$1" != -- ]; do args+=("$1"); shift; done
            shift
            docker compose "${args[@]}" config --format json | jq -e \
              --arg dir "$1" --arg actions "$2" --arg connections "$3" --arg labels "$4" '
                .services.api as $api
                | ([($api.volumes // [])[] | select(.target == "/etc/tim") | del(.bind)]
                    == [{type: "bind", source: $dir, target: "/etc/tim", read_only: true}])
                and $api.environment.TIM_ACTIONS_DIR == $actions
                and $api.environment.TIM_CONNECTIONS_FILE == $connections
                and $api.environment.TIM_LABELS_FILE == $labels' > /dev/null
          }
          assert_api_mount -f compose.yaml -- "$PWD/deploy/config" "" "" ""
          assert_api_mount -f deploy/compose.prod.yaml --env-file deploy/.env -- "$PWD/deploy/config" "" "" ""
          sed -i -e 's|^#TIM_CONFIG_DIR=.*|TIM_CONFIG_DIR=/srv/tim|' \
                 -e 's|^TIM_ACTIONS_DIR=$|TIM_ACTIONS_DIR=/etc/tim/actions|' \
                 -e 's|^TIM_CONNECTIONS_FILE=$|TIM_CONNECTIONS_FILE=/etc/tim/connections.yaml|' \
                 -e 's|^TIM_LABELS_FILE=$|TIM_LABELS_FILE=/etc/tim/labels.yaml|' deploy/.env
          assert_api_mount -f deploy/compose.prod.yaml --env-file deploy/.env -- /srv/tim \
            /etc/tim/actions /etc/tim/connections.yaml /etc/tim/labels.yaml
          # The example instance's variables, on top of the operator's.
          example=(--env-file deploy/.env --env-file examples/instance/deploy/compose/.env)
          assert_api_mount -f deploy/compose.prod.yaml "${example[@]}" -- /srv/tim-instance/config \
            /etc/tim/actions /etc/tim/connections.yaml /etc/tim/labels.yaml
          image="$(docker compose -f deploy/compose.prod.yaml "${example[@]}" config --format json | jq -r .services.api.image)"
          if [ "$image" != registry.example.com/tim-instance:2.0.0-example.1 ]; then
            echo "the example instance must run its derived image, got $image" >&2
            exit 1
          fi
