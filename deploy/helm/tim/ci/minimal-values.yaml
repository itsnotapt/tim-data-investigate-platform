# Smallest valid configuration: external PostgreSQL, ingress with TLS, no licence key.
config:
  auth:
    tenantId: 11111111-1111-1111-1111-111111111111
    clientId: 22222222-2222-2222-2222-222222222222
  tags:
    clusterUri: https://tags.westeurope.kusto.windows.net
secrets:
  databaseUrl: postgresql+asyncpg://tim:secret@db.example.com:5432/tim
  authClientSecret: client-secret
ingress:
  host: tim.example.com
