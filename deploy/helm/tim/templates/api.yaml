apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tim.fullname" . }}-api
  labels:
    {{- include "tim.componentLabels" (list . "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tim.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-api.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.actions.files }}
        checksum/actions: {{ include (print $.Template.BasePath "/configmap-actions.yaml") . | sha256sum }}
        {{- end }}
        {{- if or .Values.connections .Values.labels }}
        checksum/api-files: {{ include (print $.Template.BasePath "/configmap-api-files.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tim.componentLabels" (list . "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tim.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "tim.image" (list . .Values.api.image "backend") | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "tim.fullname" . }}-api
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "tim.databaseUrlEnv" . | nindent 12 }}
            - name: TIM_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tim.secretName" . }}
                  key: TIM_AUTH_CLIENT_SECRET
                  optional: true
            {{- if include "tim.actionsConfigMap" . }}
            - name: TIM_ACTIONS_DIR
              value: /etc/tim/actions
            {{- end }}
            {{- if .Values.connections }}
            - name: TIM_CONNECTIONS_FILE
              value: /etc/tim/connections.yaml
            {{- end }}
            {{- if .Values.labels }}
            - name: TIM_LABELS_FILE
              value: /etc/tim/labels.yaml
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "tim.actionsConfigMap" . }}
            - name: actions
              mountPath: /etc/tim/actions
              readOnly: true
            {{- end }}
            {{- if .Values.connections }}
            - name: api-files
              mountPath: /etc/tim/connections.yaml
              subPath: connections.yaml
              readOnly: true
            {{- end }}
            {{- if .Values.labels }}
            - name: api-files
              mountPath: /etc/tim/labels.yaml
              subPath: labels.yaml
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with include "tim.actionsConfigMap" . }}
        - name: actions
          configMap:
            name: {{ . }}
        {{- end }}
        {{- if or .Values.connections .Values.labels }}
        - name: api-files
          configMap:
            name: {{ include "tim.fullname" . }}-api-files
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tim.apiServiceName" . }}
  labels:
    {{- include "tim.componentLabels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "tim.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
