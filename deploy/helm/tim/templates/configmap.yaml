{{- include "tim.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tim.fullname" . }}-api
  labels:
    {{- include "tim.componentLabels" (list . "api") | nindent 4 }}
data:
  TIM_ENVIRONMENT: {{ .Values.config.environment | quote }}
  TIM_LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  TIM_AUTH_TENANT_ID: {{ .Values.config.auth.tenantId | quote }}
  TIM_AUTH_CLIENT_ID: {{ .Values.config.auth.clientId | quote }}
  TIM_TAG_CLUSTER_URI: {{ .Values.config.tags.clusterUri | quote }}
  TIM_TAG_DATABASE: {{ .Values.config.tags.database | quote }}
  {{- with .Values.api.allowedKustoSuffixes }}
  TIM_ALLOWED_KUSTO_SUFFIXES: {{ join "," . | quote }}
  {{- end }}
  TIM_ALLOWED_KUSTO_HOSTS: {{ join "," .Values.api.allowedKustoHosts | quote }}
  TIM_CORS_ALLOWED_ORIGINS: {{ join "," .Values.api.corsAllowedOrigins | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.api.forwardedAllowIps | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tim.fullname" . }}-web
  labels:
    {{- include "tim.componentLabels" (list . "web") | nindent 4 }}
data:
  TIM_ENVIRONMENT: {{ .Values.config.environment | quote }}
  BACKEND_URI: {{ printf "http://%s.%s.svc.%s:%v" (include "tim.apiServiceName" .) .Release.Namespace .Values.clusterDomain .Values.api.service.port | quote }}
  REDIRECT_URI: {{ printf "%s/blank.html" (include "tim.publicUrl" .) | quote }}
  AUTH_CLIENT_ID: {{ .Values.config.auth.clientId | quote }}
  AUTH_TENANT_ID: {{ .Values.config.auth.tenantId | quote }}
  TAG_CLUSTER: {{ .Values.config.tags.clusterUri | quote }}
  TAG_DATABASE: {{ .Values.config.tags.database | quote }}
  API_BASEPATH: {{ .Values.web.apiBasePath | quote }}
  HELP_WIKI_URI: {{ .Values.web.helpWikiUri | quote }}
  HELP_ISSUE_URI: {{ .Values.web.helpIssueUri | quote }}
  {{- with .Values.web.defaultClusters }}
  DEFAULT_CLUSTERS: {{ toJson . | quote }}
  {{- end }}
