{{- if not .Values.secrets.existingSecret }}
{{- /* A hook so it exists before the pre-install/pre-upgrade migrations Job. Helm does not delete
hook resources on uninstall: remove it with kubectl delete secret <fullname>. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tim.fullname" . }}
  labels:
    {{- include "tim.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  TIM_DATABASE_URL: {{ include "tim.postgresqlDatabaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- else }}
  TIM_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.authClientSecret }}
  TIM_AUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.agGridLicense }}
  AGGRID_LICENSE: {{ . | quote }}
  {{- end }}
{{- end }}
