{{- with include "tim.apiFilesConfigMap" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ . }}
  labels:
    {{- include "tim.componentLabels" (list $ "api") | nindent 4 }}
data:
  {{- with $.Values.connections }}
  connections.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $.Values.labels }}
  labels.yaml: |
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
