# What a process did, one line per Sysmon event: the processes it started, its network connections,
# files, file streams and file times, its registry changes, the threads it started in other processes
# and its exit.
type: kql_query
key: demo.process-activity
name: Process activity
title: "{{ action_name }} for {{ process }} on {{ host }}"
menu: Endpoint
description: Every Sysmon event of a process on its host, one line each
pivot: row
connection: security
database: Security
kql_file: process-activity.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: process
    kind: string
    title: Process GUID
    from_columns: [ProcessGuid]
  - name: around
    kind: datetime
    title: Around
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Window (±)
    default: P1D
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
