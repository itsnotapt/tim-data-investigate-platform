# Host timeline: every sourcetype on a row's host, in a window around the row's time.
type: kql_query
key: demo.host-timeline
name: Host timeline
menu: Host
description: The sequence of events on the host, from every sourcetype, in a window around the row's time
pivot: row
connection: security
database: Security
kql_file: host-timeline.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: at
    kind: datetime
    title: Around
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Window
    default: PT15M
    help: How far before and after the time to look
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: Host, type: string, width: 140}
  - {name: SourceType, type: string, title: Sourcetype, width: 300}
  - {name: Source, type: string, width: 300}
  - {name: Raw, type: string, hidden: true}
  - {name: EventId, type: string, title: Id}
