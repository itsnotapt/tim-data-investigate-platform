# Host timeline: what happened on a host nearest a time such as a row's, one line per Sysmon event or alert.
# An alert's row has the alert's EventId, so Go to pivot row finds the alert pivoted from.
type: kql_query
key: demo.host-timeline
name: Host timeline
title: "{{ action_name }} {{ host }}"
menu: Host
description: What happened on the host nearest a time, one line per Sysmon event or alert
pivot: row
find_pivot_rows: true
connection: security
database: Security
kql_file: host-timeline.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: around
    kind: datetime
    title: Around
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Window (±)
    default: PT15M
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
  - {name: Severity, type: string}
  - {name: Alert, type: string, width: 240}
  - {name: Product, type: string, width: 240}
  - {name: SHA256, type: string}
