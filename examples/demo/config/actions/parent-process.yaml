# The process that started a process, from the process's row.
type: kql_query
key: demo.parent-process
name: Parent process
title: "Parent process {row.ParentImage} on {host}"
menu: Endpoint
description: The process that started a process
pivot: row
connection: security
database: Security
kql_file: parent-process.kql
params:
  - name: host
    kind: string
    from_columns: [Host]
  - name: parent_process_guid
    kind: string
    from_columns: [ParentProcessGuid]
  - name: around
    kind: datetime
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    default: P1D
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
  - {name: User, type: string, width: 200}
  - {name: ParentImage, type: string, width: 320}
  - {name: CommandLine, type: string, width: 480}
  - {name: Image, type: string, width: 320}
  - {name: ParentCommandLine, type: string, width: 360}
  - {name: SHA256, type: string}
