# A process and up to five generations of the processes above it, from its row, oldest first.
# Depth is 0 for the process, 1 for its parent, 2 for its grandparent.
type: kql_query
key: demo.process-tree
name: Process tree
title: "Process tree of {row.Image} on {host}"
menu: Endpoint
description: A process and up to five generations of the processes above it
pivot: row
connection: security
database: Security
kql_file: process-tree.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: process
    kind: string
    title: Process GUID
    from_columns: [ProcessGuid]
  - name: around
    kind: datetime
    title: Around
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Window (±)
    default: P1D
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
  - {name: Depth, type: number, width: 90}
  - {name: User, type: string, width: 200}
  - {name: ParentImage, type: string, width: 320}
  - {name: CommandLine, type: string, width: 480}
  - {name: Image, type: string, width: 320}
  - {name: ParentCommandLine, type: string, width: 360}
  - {name: SHA256, type: string}
