# The runs of a file after a process created it, to spot dropped payloads.
type: kql_query
key: demo.file-executed-after-creation
name: File executed after creation
title: "{{ file }} executed on {{ host }} after creation"
menu: Endpoint
description: The processes started from a file on its host after it was created
pivot: row
connection: security
database: Security
kql_file: file-executed-after-creation.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: file
    kind: string
    title: File
    from_columns: [TargetFilename]
  - name: created
    kind: datetime
    title: Created
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Within
    default: P1D
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
  - {name: User, type: string, width: 200}
  - {name: ParentImage, type: string, width: 320}
  - {name: CommandLine, type: string, width: 480}
  - {name: Image, type: string, width: 320}
  - {name: ParentCommandLine, type: string, width: 360}
  - {name: SHA256, type: string}
