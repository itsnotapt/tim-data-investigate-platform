# What a user did on every host around a time: the processes they started and the connections
# those made.
type: kql_query
key: demo.by-user
name: By user
title: "{{ action_name }} {{ user }}"
menu: Endpoint
description: The processes a user started and the network connections they made, on every host, in the window around a time
pivot: row
connection: security
database: Security
kql_file: by-user.kql
params:
  - name: user
    kind: string
    title: User
    from_columns: [User]
  - name: around
    kind: datetime
    title: Around
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Window (±)
    default: PT1H
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: EventType, type: string, title: Event type, width: 170}
  - {name: Host, type: string, width: 120}
  - {name: Summary, type: string, width: 640}
