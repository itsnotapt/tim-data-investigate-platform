# Whether a file a process created was run afterwards, to spot dropped payloads.
type: kql_query
key: demo.file-created-then-run
name: File created, then run?
menu: Endpoint
description: The processes started from a file on its host after it was created
pivot: row
connection: security
database: Security
kql_file: file-created-then-run.kql
params:
  - name: host
    kind: string
    title: Host
    from_columns: [Host]
  - name: file
    kind: string
    title: File
    from_columns: [TargetFilename]
  - name: created
    kind: datetime
    title: Created
    from_columns: [Timestamp]
  - name: window
    kind: timespan
    title: Within
    default: P1D
id: EventId
columns:
  - {name: Timestamp, type: datetime, pinned: left, sort: asc}
  - {name: Host, type: string, width: 120}
  - {name: User, type: string, width: 200}
  - {name: Image, type: string, width: 320}
  - {name: CommandLine, type: string, width: 480}
  - {name: ParentImage, type: string, width: 320}
  - {name: ParentCommandLine, type: string, width: 360}
  - {name: ProcessId, type: number}
  - {name: ParentProcessId, type: number}
  - {name: ProcessGuid, type: string}
  - {name: ParentProcessGuid, type: string}
  - {name: SHA256, type: string}
  - {name: MD5, type: string}
  - {name: Computer, type: string}
  - {name: UtcTime, type: datetime}
  - {name: EventId, type: string, title: Id}
