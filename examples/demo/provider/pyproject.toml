[project]
name = "tim-demo"
version = "0.1.0"
description = "The demo instance's provider: the kusto_save sink type"
requires-python = ">=3.12,<3.13"
dependencies = ["tim-actions[kusto]>=0.1,<0.2"]

# TIM finds the provider through this entry point.
[project.entry-points."tim.actions"]
demo = "tim_demo:provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tim_demo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
