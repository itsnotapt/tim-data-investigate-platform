# The example instance under Helm, on top of the operator's own values
# (docs/actions.md#building-and-deploying):
#   helm upgrade --install tim oci://ghcr.io/itsnotapt/tim-data-investigate-platform/charts/tim \
#     --version X.Y.Z -n tim -f <your values> -f values.yaml
# The files are config/'s, inline. TIM's CI checks they match.

# The derived image: TIM's backend image with the provider installed. Name its tag
# <tim version>-<revision>.
api:
  image:
    repository: registry.example.com/tim-instance
    tag: 5.0.0-example.1

# The action files, by file name, sidecars included: mounted at /etc/tim/actions.
actions:
  files:
    storm-events.kql: |
      declare query_parameters(states: dynamic, since: datetime = datetime(2007-01-01),
          until: datetime = datetime(2008-01-01));
      StormEvents
      | where State in (states) and StartTime between (since .. until)
      | project StartTime, EndTime, State, EventType, EventId, EpisodeId, DamageProperty,
          DeathsDirect, EventNarrative
      | order by StartTime desc
      | take 1000
    storm-events.yaml: |
      # yaml-language-server: $schema=../../schema/actions.schema.json
      # kql_query actions over Samples.StormEvents: one with its KQL in a sidecar, one inline.
      type: kql_query
      key: example.storm_events
      name: Storm events
      menu: Weather
      description: Storm events in the selected states
      pivot: rows
      connection: samples
      database: Samples
      kql_file: storm-events.kql
      params:
        - name: states
          kind: string
          title: States
          many: true
          from_columns: [State]
        - name: since
          kind: datetime
          title: Since
          required: false       # left out, the KQL's declared default applies
        - name: until
          kind: datetime
          title: Until
          required: false
      id: EventId
      columns:
        - {name: StartTime, type: datetime, title: Start, pinned: left, sort: desc}
        - {name: State, type: string, width: 160}
        - {name: EventType, type: string, title: Event type}
        - {name: EventNarrative, type: string, title: Narrative, hidden: true}
      ---
      type: kql_query
      key: example.storm_episode
      name: Storm episode
      menu: Weather
      description: Every event in the episode of the selected event
      pivot: row
      connection: samples
      database: Samples
      params:
        - name: episode
          kind: number
          title: Episode
          from_columns: [EpisodeId]
      id: EventId
      kql: |
        declare query_parameters(episode: long);
        StormEvents
        | where EpisodeId == episode
        | project StartTime, EndTime, State, EventType, EventId, EpisodeId, EventNarrative
        | order by StartTime asc

# The connections file and the labels file, as YAML: mounted under /etc/tim.
connections:
  - name: samples
    title: Samples (help cluster)
    type: kusto
    auth: obo
    cluster: https://help.kusto.windows.net
    databases: [Samples]
  # A lookup table runs as TIM, so every analyst sees all of it.
  - name: regions
    title: US regions
    type: lookup
    auth: workload_identity
    entries:
      CALIFORNIA: {Region: West, Division: Pacific}
      FLORIDA: {Region: South, Division: South Atlantic}
      ILLINOIS: {Region: Midwest, Division: East North Central}
      IOWA: {Region: Midwest, Division: West North Central}
      KANSAS: {Region: Midwest, Division: West North Central}
      MISSOURI: {Region: Midwest, Division: West North Central}
      NEBRASKA: {Region: Midwest, Division: West North Central}
      NEW YORK: {Region: Northeast, Division: Middle Atlantic}
      OKLAHOMA: {Region: South, Division: West South Central}
      TEXAS: {Region: South, Division: West South Central}

labels:
  - {key: damaging, name: Damaging, colour: red, symbol: warning}
  - {key: follow-up, name: Follow up, colour: amber, symbol: flag}
  - {key: reviewed, name: Reviewed, colour: green, symbol: check}
  - {key: duplicate, name: Duplicate, colour: grey, symbol: block}
