[project]
name = "tim-ci-provider"
version = "0.1.0"
description = "A provider with one connection type, for the derived-image test"
requires-python = ">=3.12"
dependencies = ["tim-actions>=0.1,<0.2"]

[project.entry-points."tim.actions"]
ci = "tim_ci_provider:provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tim_ci_provider"]
