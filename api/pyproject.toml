[project]
name = "tim-api"
version = "0.1.0"
description = "TIM backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "httpx2>=2.13.1",
    "pyjwt[crypto]>=2.15.1",
    "msal>=1.39.0",
    "azure-kusto-data>=6.0.4",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "jsonpatch>=1.33",
    "azure-kusto-ingest>=6.0.4",
    "azure-identity>=1.25.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pgserver>=0.1.4",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tim_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # bandit: allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov -m \"not slow\""
markers = ["slow: takes more than ~5 s (deselect with -m \"not slow\")", "kusto: integration test against a real Kusto ingest endpoint (needs TIM_TEST_KUSTO_INGEST_URL)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["tim_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true
