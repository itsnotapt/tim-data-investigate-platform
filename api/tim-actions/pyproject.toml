[project]
name = "tim-actions"
version = "0.1.0"
description = "The interface TIM providers build against: actions, params, columns, providers and hooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
kusto = ["azure-kusto-data>=6.0.4"]

# TIM's built-in provider registers the same way as any other.
[project.entry-points."tim.actions"]
tim = "tim_actions.builtin:provider"

[dependency-groups]
dev = [
    "tim-actions[kusto]",
    "mypy>=2.4.0",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tim_actions"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # bandit: allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov"

[tool.coverage.run]
source = ["tim_actions"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
