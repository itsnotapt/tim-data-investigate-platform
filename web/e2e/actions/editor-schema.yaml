# An editor whose schema comes from a dev_kql connection (TIM_DEV_ACTIONS), for completion flows.
type: dev_rows
key: dev-kql-editor
name: KQL editor
menu: Development / Editor
description: A Query editor that completes from the chosen connection and database
pivot: none
params:
  - name: connection
    kind: connection
    connection_type: dev_kql
  - name: database
    kind: string
  - name: query
    kind: kql
    schema_from: [connection, database]
rows:
  - { Step: done }
